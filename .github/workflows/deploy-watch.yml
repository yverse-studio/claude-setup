name: deploy-watch

# Every 15 minutes: does each live project serve its main HEAD? Drift over 15 minutes opens one
# `deploy-drift` issue per project here; recovery closes it
# (scripts/deploy-watch.mjs). Read-only on the project repos; writes only this repo's issues.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-watch

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test scripts/deploy-watch.test.mjs
      - run: node scripts/deploy-watch.mjs
        env:
          PROJECTS_GITHUB_TOKEN: ${{ secrets.PROJECTS_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
