name: build-logs

# Prints the tail of a project's latest Workers Builds log (redacted), so a cloud thread can read
# why a build failed without the Cloudflare dashboard. Read-only. Started with Run workflow or a
# thread's workflow dispatch; input: the Worker name.
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Worker name (lowercase letters, digits, dashes)'
        required: true
        type: string
      cancel:
        description: 'Cancel builds stuck queued or running for over 10 minutes'
        required: false
        type: boolean
        default: false
      branch:
        description: 'Start a Workers Builds build of this branch (a Worker Preview), for a push the webhook missed'
        required: false
        type: string
      commit:
        description: 'Optional commit sha for that build (7 to 40 hex characters)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  logs:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test scripts/build-logs.test.mjs
      - run: node scripts/build-logs.mjs
        env:
          NAME: ${{ inputs.name }}
          CANCEL: ${{ inputs.cancel }}
          BUILD_BRANCH: ${{ inputs.branch }}
          BUILD_COMMIT: ${{ inputs.commit }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
