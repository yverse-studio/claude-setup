name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # floor-guard needs the merge base
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check.mjs
      - name: floor guard
        if: github.event_name == 'pull_request'
        run: node .claude/skills/publish/templates/new-project/scripts/floor-guard.mjs --base origin/${{ github.base_ref }}
      - run: node --test scripts/floor-guard.test.mjs scripts/project-checks.test.mjs scripts/new-project.test.mjs scripts/delete-project.test.mjs scripts/build-logs.test.mjs scripts/guards.test.mjs scripts/research-check.test.mjs .claude/skills/game-3d/scripts/check-assets.test.mjs .claude/skills/game-3d/scripts/gdd-check.test.mjs .claude/skills/game-3d/scripts/audio-check.test.mjs .claude/skills/ui-review/scripts/design-check.test.mjs .claude/skills/ui-review/scripts/copy-check.test.mjs .claude/skills/market/scripts/analytics-check.test.mjs .claude/skills/operator/templates/loop/loop.test.mjs .claude/skills/operator/templates/mailbox/mailbox.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s .claude/skills/watch/scripts -p "test_*.py"
      - run: python -m unittest discover -s .claude/skills/video-studio/scripts -p "test_*.py"
      - run: node --test scripts/playtest-check.test.mjs
      # Runs without a login (tested with an empty HOME on 2026-10-06).
      - name: team mod
        shell: bash
        run: |
          npx -y @anthropic-ai/claude-code@2.1.292 plugin validate mods/team
          npx -y @anthropic-ai/claude-code@2.1.292 plugin test mods/team
      # Full install (ECC hooks included) into a throwaway home; plugins need the claude CLI,
      # which CI does not have, so the installer skips them with a warning.
      - name: install into a temp home
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home"
          mkdir -p "$HOME/.claude"
          echo '# my notes' > "$HOME/.claude/CLAUDE.md"
          node install.mjs
          node install.mjs --skip-hooks
          test "$(grep -c 'claude-setup:start' "$HOME/.claude/CLAUDE.md")" = 1
          grep -q '# my notes' "$HOME/.claude/CLAUDE.md"
          test -f "$HOME/.claude/skills/ship-check/SKILL.md"
          test -f "$HOME/.claude/agents/design-critic.md"
          test -f "$HOME/.claude/agents/red-team.md"
          test -f "$HOME/.claude/skills/operator/templates/features.json"
          test -f "$HOME/.claude/skills/legal/scripts/privacy-scan.mjs"
          node -e "const s=require(process.env.HOME+'/.claude/settings.json'); if(!s.hooks||!s.statusLine||s.permissions.defaultMode!=='auto') process.exit(1)"
          echo '{"model":{"display_name":"Test"},"workspace":{"current_dir":"."},"context_window":{"remaining_percentage":70}}' | node "$HOME/.claude/claude-setup/statusline.mjs"
          node -e "const s=require(process.env.HOME+'/.claude/settings.json'); if(!JSON.stringify(s.hooks.PostToolUse).includes('context-guard.mjs')) process.exit(1)"
          export T="$RUNNER_TEMP/t.jsonl"
          echo '{"message":{"usage":{"input_tokens":1,"cache_read_input_tokens":40000}}}' > "$T"
          echo '{"message":{"usage":{"input_tokens":1,"cache_read_input_tokens":260000}}}' >> "$T"
          node -e "process.stdout.write(JSON.stringify({session_id:'ci',transcript_path:process.env.T}))" | node "$HOME/.claude/claude-setup/context-guard.mjs" | grep -q 'Context guard'
