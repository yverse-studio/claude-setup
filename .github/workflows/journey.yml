name: journey

# The gate's preview journey for one project PR (gate.md, check 2; incident 2026-10-26: UI PRs passed
# on local tests while the preview was broken). Waits until the PR's Worker Preview serves its head,
# runs the project's `npm run journey` against it on a phone profile, then posts the `journey`
# commit status on that PR (scripts/journey.mjs). Only this workflow posts `journey`, the n/a for a
# PR without UI files included; the project's CI has no status permission. The journey specs come
# from the project's default branch, not the PR: no PR code runs on a runner, and the job that runs
# the specs holds no org token. The status is posted from a fresh job.
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Project name (projects/<name>.json)'
        required: true
        type: string
      pr:
        description: 'PR number in that project repo'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: journey-${{ inputs.name }}-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      ui: ${{ steps.wait.outputs.ui }}
      specs_ref: ${{ steps.wait.outputs.specs_ref }}
      specs_changed: ${{ steps.wait.outputs.specs_changed }}
      sha: ${{ steps.wait.outputs.sha }}
      repo: ${{ steps.wait.outputs.repo }}
      url: ${{ steps.wait.outputs.url }}
      preview: ${{ steps.wait.outputs.preview }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test scripts/journey.test.mjs
      - id: wait
        run: node scripts/journey.mjs wait
        env:
          NAME: ${{ inputs.name }}
          PR: ${{ inputs.pr }}
          PROJECTS_GITHUB_TOKEN: ${{ secrets.PROJECTS_GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # The specs: the project's default branch, fetched here and handed on as an artifact.
      - uses: actions/checkout@v5
        if: steps.wait.outputs.ui == 'true'
        with:
          repository: ${{ steps.wait.outputs.repo }}
          ref: ${{ steps.wait.outputs.specs_ref }}
          path: specs
          token: ${{ secrets.PROJECTS_GITHUB_TOKEN }}
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        if: steps.wait.outputs.ui == 'true'
        with:
          name: journey-specs-${{ inputs.name }}-${{ inputs.pr }}
          path: |
            specs
            !specs/.git
          include-hidden-files: true
          retention-days: 1

  run:
    needs: preview
    if: needs.preview.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: specs
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: journey-specs-${{ inputs.name }}-${{ inputs.pr }}
          path: specs
      - uses: actions/setup-node@v5
        with:
          node-version-file: specs/.node-version
      - name: needs a journey script
        run: |
          npm pkg get scripts.journey | grep -qv '^{}$' || { echo "::error::package.json has no \"journey\" script: no journey, no pass (publish skill, Preview journey)"; exit 1; }
      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run journey
        env:
          BASE_URL: ${{ needs.preview.outputs.url }}
          JOURNEY_DEVICE: 'iPhone 13'
          PREVIEW_LOGIN_TOKEN: ${{ secrets.PREVIEW_LOGIN_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-${{ inputs.name }}-${{ inputs.pr }}
          path: |
            specs/test-results/
            specs/playwright-report/
          if-no-files-found: ignore

  report:
    needs: [preview, run]
    if: always() && needs.preview.outputs.ui == 'true' && needs.preview.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/journey.mjs report
        env:
          REPO: ${{ needs.preview.outputs.repo }}
          SPECS_CHANGED: ${{ needs.preview.outputs.specs_changed }}
          SHA: ${{ needs.preview.outputs.sha }}
          RESULT: ${{ needs.preview.outputs.preview == 'missing' && 'no-preview' || needs.run.result }}
          PROJECTS_GITHUB_TOKEN: ${{ secrets.PROJECTS_GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
