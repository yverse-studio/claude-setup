name: new-project

# Makes a new project live with no hands: the repo in the org, its D1 databases (EU), the Worker,
# the Workers Builds connection (main deploys, other branches get Previews) and the first build.
# Started by Run workflow (a cloud thread's workflow dispatch, the PC or the Actions page) or by
# new-project-request.yml (a pushed branch `new/<name>`). On `workflow_run`
# GitHub runs this file and the checked-out code from `main`; the pushed branch supplies only
# `projects/<name>.json`. The branch is deleted when the run succeeds. Then `add_repo` the result.
# Keys: secrets CLOUDFLARE_API_TOKEN and PROJECTS_GITHUB_TOKEN, variable CLOUDFLARE_ACCOUNT_ID
# (publish skill, §A new project).
on:
  workflow_run:
    workflows: [new-project-request]
    types: [completed]
  workflow_dispatch:
    inputs:
      name:
        description: 'Repo and Worker name (lowercase letters, digits, dashes)'
        required: true
        type: string
      d1:
        description: 'With a D1 database (live + preview, EU)'
        required: false
        type: boolean
        default: true
      kind:
        description: 'site (day-zero site), game (static three.js game, no D1) or repo (private repo only, no Worker)'
        required: false
        type: choice
        options: [site, game, repo]
        default: site
      org:
        description: 'GitHub org that owns the repo'
        required: false
        type: string
        default: yverse-studio

permissions:
  contents: read

concurrency:
  group: new-project-${{ inputs.name || github.event.workflow_run.head_branch }}

jobs:
  setup:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && startsWith(github.event.workflow_run.head_branch, 'new/'))
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - if: github.event_name == 'workflow_run'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: incoming
          persist-credentials: false
          sparse-checkout: projects
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test scripts/new-project.test.mjs
      - run: node scripts/new-project.mjs
        env:
          PROJECT_BRANCH: ${{ github.event.workflow_run.head_branch }}
          NAME: ${{ inputs.name }}
          D1: ${{ inputs.d1 }}
          KIND: ${{ inputs.kind }}
          ORG: ${{ inputs.org }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PROJECTS_GITHUB_TOKEN: ${{ secrets.PROJECTS_GITHUB_TOKEN }}
          CLOUDFLARE_BUILD_TOKEN: ${{ secrets.CLOUDFLARE_BUILD_TOKEN }}
          BUILD_TOKEN_NAME: ${{ vars.BUILD_TOKEN_NAME }}

  cleanup:
    # Only this job may write to the repo, and it runs no repo code.
    needs: setup
    if: github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.head_branch, 'new/')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      # 422 = the branch is already gone (a second run for the same push deleted it): not an error.
      - run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" || echo "branch $BRANCH already gone"
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
