# Goes to .github/workflows/ci.yml. Tests only: Cloudflare Workers Builds deploys `main` and
# gives every other branch its own preview (`publish` skill), so this workflow holds no keys.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Stripe's official API mock: the e2e tests create real Checkout Sessions against it.
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports: ['12111:12111']
    env:
      STRIPE_MOCK: http://127.0.0.1:12111
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # floor-guard needs the merge base
          persist-credentials: false
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: floor guard
        if: github.event_name == 'pull_request'
        run: node scripts/floor-guard.mjs --base origin/${{ github.base_ref }}
