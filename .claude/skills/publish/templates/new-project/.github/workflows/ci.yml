name: CI

# Tests only. Cloudflare Workers Builds builds every branch itself: main goes live,
# every other branch gets a Worker Preview. No keys here.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # floor-guard needs the merge base
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm install
      - run: npm run verify
      - name: floor guard
        if: github.event_name == 'pull_request'
        run: node scripts/floor-guard.mjs --base origin/${{ github.base_ref }}
      - name: role checks # design, copy, tracking plan; games also game design and sound (scripts/project-checks.mjs)
        if: github.event_name == 'pull_request'
        run: node scripts/project-checks.mjs --base origin/${{ github.base_ref }}
      - name: playtest check # games only: scripts/playtest-check.mjs ships with kind "game"
        if: github.event_name == 'pull_request' && hashFiles('scripts/playtest-check.mjs') != ''
        run: node scripts/playtest-check.mjs --base origin/${{ github.base_ref }}

  # No `journey` status here: only claude-setup's journey.yml posts it (org token, specs from this
  # repo's default branch), the n/a for a PR without UI files too. This workflow has no `statuses`
  # permission, so a PR cannot post its own pass (incident 2026-10-26; gate.md, UI PRs).
