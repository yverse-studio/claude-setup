<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__NAME__</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fffdf7; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; z-index: 2; inset: 12px auto auto 12px; font: 700 18px/1.3 system-ui, sans-serif; color: #1f2937; pointer-events: none; }
  /* End card: a light scrim (about 20 %) so the scene stays readable; the HUD sits above it (z-index 2). */
  #end { position: fixed; z-index: 1; inset: 0; display: none; place-items: center; background: rgb(31 41 55 / 0.2); pointer-events: none; }
  #end.show { display: grid; }
  #end div { background: #fffdf7; color: #1f2937; border-radius: 16px; padding: 20px 28px; font: 700 20px/1.4 system-ui, sans-serif; text-align: center; box-shadow: 0 4px 0 #e8c9a8; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<div id="end"><div></div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
