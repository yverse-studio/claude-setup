# Copy to .github/workflows/android-release.yml in the app repo, with scripts/build-android.sh.
# Tag v1.2.3 -> signed APK + AAB, APK attached to a GitHub Release, AAB to Google Play (internal track)
# once the secret PLAY_SERVICE_ACCOUNT_JSON exists. Before that the tag still gives the APK.
# Secrets (app repo, Settings > Secrets > Actions): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, and later PLAY_SERVICE_ACCOUNT_JSON. Never in chat.
name: android-release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version: { description: 'x.y.z (must be higher than every earlier release)', required: true }
      play: { description: 'Upload to Google Play', type: boolean, default: false }
      track: { description: 'Play track', type: choice, options: [internal, alpha, beta, production], default: internal }
      status: { description: 'completed, or draft for the very first upload of a new app', type: choice, options: [completed, draft], default: completed }

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build and sign
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          VERSION="${VERSION#v}" KEYSTORE="$RUNNER_TEMP/upload.jks" bash scripts/build-android.sh
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.VERSION }}
          path: dist-android/
          retention-days: 14
      - name: GitHub Release (the website links to releases/latest/download/<name>.apk)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG="v$VERSION"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes
          gh release upload "$TAG" dist-android/*.apk dist-android/*.sha256 --clobber
      - name: Google Play
        if: env.HAS_PLAY == 'true' && (github.event_name == 'push' || inputs.play)
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: studio.yverse.CHANGE_ME # = appId in capacitor.config.json, permanent once on Play
          releaseFiles: dist-android/*.aab
          track: ${{ inputs.track || 'internal' }}
          status: ${{ inputs.status || 'completed' }}
